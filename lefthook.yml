pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "src/**/*.{js,ts,tsx,json}"
      run: bunx biome check --write --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    astro-check:
      run: bun run astro check

post-checkout:
  commands:
    splashdown:
      run: splash

pre-push:
  commands:
    check-all:
      run: bun run check-all
